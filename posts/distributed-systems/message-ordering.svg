  <defs
     id="defs82" />
  <title
     id="title">Events and messages across three processes</title>
  <desc
     id="desc">Three vertical process timelines, A, B, and C. Time proceeds downward. A contains events a then b. B contains c then d. C contains e then f. Message m 1 is sent from b on A to c on B. Message m 2 is sent from d on B to f on C. The vertical alignment of events on different processes does not establish a causal relationship.</desc>
