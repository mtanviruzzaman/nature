<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="286" viewBox="0 0 1040 286" role="img" aria-labelledby="title desc">
<title id="title">Residual NTP error from unequal one-way delays</title>
<desc id="desc">A bar of total round-trip delay delta is divided into a longer, hatched first delay delta 1 and a shorter second delay delta 2. A dashed line marks delta divided by 2. The brace epsilon spans from that midpoint to the boundary between the two delays.</desc>
<metadata>Redrawn from the user's sketch. Computer Modern mathematical lettering is outlined to preserve its appearance. The illustrated case has delta 1 greater than delta 2; epsilon equals delta 1 minus delta divided by 2.</metadata>
