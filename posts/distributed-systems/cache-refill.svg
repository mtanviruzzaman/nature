<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Per-key cache refill state</title><desc id="desc">On one web server, an atomic transition elects one refill owner for a missing key. Other requests wait with deadlines and bounded queues. A live successful result becomes fresh until its original deadline. Failure clears the state only if the task still owns it; obsolete late completions are discarded. This is not fleet-wide coalescing.</desc>
<rect width="1000" height="760" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#333;stroke-width:2;stroke-linejoin:round;stroke-linecap:round} .hint{fill:#666}</style>
<text x="35" y="39" font-size="27" font-weight="600" text-anchor="start" fill="#222">One refill owner per key, per web server</text>
<text x="35" y="70" font-size="18" font-weight="normal" text-anchor="start" fill="#666">Singleflight reduces duplicate reads; it does not eliminate cold-miss latency.</text>
<rect x="40" y="270" width="250" height="111" rx="8" fill="#f8f8f8" stroke="#555" stroke-width="1.6"/>
<text x="165.0" y="301" font-size="21" font-weight="600" text-anchor="middle" fill="#222">Missing / expired</text>
<text x="165.0" y="330" font-size="17" font-weight="normal" text-anchor="middle" fill="#222">No usable mapping</text>
<rect x="385" y="270" width="250" height="111" rx="8" fill="#f8f8f8" stroke="#555" stroke-width="1.6"/>
<text x="510.0" y="301" font-size="21" font-weight="600" text-anchor="middle" fill="#222">Refilling</text>
<text x="510.0" y="330" font-size="17" font-weight="normal" text-anchor="middle" fill="#222">Owner token + deadline</text>
<text x="510.0" y="354" font-size="17" font-weight="normal" text-anchor="middle" fill="#222">One database read</text>
<rect x="730" y="270" width="230" height="111" rx="8" fill="#f8f8f8" stroke="#555" stroke-width="1.6"/>
<text x="845.0" y="301" font-size="21" font-weight="600" text-anchor="middle" fill="#222">Fresh</text>
<text x="845.0" y="330" font-size="17" font-weight="normal" text-anchor="middle" fill="#222">Fixed expires_at</text>
<path class="edge" d="M 293,323 H 382" marker-end="url(#arrow)"/>
<text x="337" y="303" font-size="16" font-weight="normal" text-anchor="middle" fill="#222">Atomic claim</text>
<path class="edge" d="M 638,323 H 727" marker-end="url(#arrow)"/>
<text x="684" y="283" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">Success</text>
<text x="684" y="302" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">before expiry</text>
<path class="edge" d="M 845,267 V 130 H 80 V 267" marker-end="url(#arrow)"/>
<text x="500" y="119" font-size="18" font-weight="normal" text-anchor="middle" fill="#222">Deadline reached → expire</text>
<rect x="365" y="470" width="290" height="110" rx="8" fill="#f8f8f8" stroke="#555" stroke-width="1.6"/>
<text x="510.0" y="501" font-size="21" font-weight="600" text-anchor="middle" fill="#222">Other requests</text>
<text x="510.0" y="530" font-size="17" font-weight="normal" text-anchor="middle" fill="#222">Wait for the same refill</text>
<text x="510.0" y="554" font-size="17" font-weight="normal" text-anchor="middle" fill="#222">Bound queue size and wait time</text>
<path class="edge" d="M 510,467 V 384" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="633" y="435" font-size="16" font-weight="normal" text-anchor="middle" fill="#222">Concurrent misses</text>
<path class="edge" d="M 450,267 V 190 H 230 V 267" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="340" y="179" font-size="16" font-weight="normal" text-anchor="middle" fill="#222">Failure / timeout</text>
<rect x="45" y="620" width="910" height="100" rx="8" fill="#f1f1f1" stroke="#555" stroke-width="1.6"/>
<text x="500" y="651" font-size="18" font-weight="normal" text-anchor="middle" fill="#222">Publish or clear state only if the refill still owns its token.</text>
<text x="500" y="677" font-size="18" font-weight="normal" text-anchor="middle" fill="#222">Discard expired or obsolete late results; release waiters on failure.</text>
<text x="500" y="703" font-size="18" font-weight="normal" text-anchor="middle" fill="#222">Across web servers, additional coalescing requires separate coordination.</text>
</svg>
