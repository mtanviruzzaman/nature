<text x="777.5" y="579" font-size="21" font-weight="600" text-anchor="middle" fill="#222">Routing metadata</text>
<text x="777.5" y="608" font-size="17" font-weight="normal" text-anchor="middle" fill="#222">Range → owner + epoch</text>
<text x="777.5" y="632" font-size="17" font-weight="normal" text-anchor="middle" fill="#222">Refresh on change / WrongShard</text>
<path class="edge" d="M 510,419 H 553 V 608 H 597" stroke-dasharray="6 5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="777" y="709" font-size="17" font-weight="normal" text-anchor="middle" fill="#666">Not consulted on every cache hit.</text>
<text x="35" y="768" font-size="18" font-weight="normal" text-anchor="start" fill="#222">Redirect: 302 + Location returns through the response path.</text>
<text x="35" y="794" font-size="18" font-weight="normal" text-anchor="start" fill="#222">Create / delete bypass HTTP response caches and reach the authoritative primary.</text>
